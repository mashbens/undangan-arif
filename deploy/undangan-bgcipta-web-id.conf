# undangan.bgcipta.web.id -- undangan pernikahan (container undangan-arif di app_net).
# Repo: /root/undangan-arif  (update: git pull && docker compose up -d --build)
# Lebih spesifik dari *.bgcipta.web.id (bgcipta-web-id.conf), jadi otomatis didahulukan.
server {
    listen 80;
    server_name undangan.bgcipta.web.id;
    absolute_redirect off;   # redirect relatif, supaya tetap https di balik Cloudflare

    location = / { return 302 /arif-landvia/; }
    location = /arif-landvia { return 301 /arif-landvia/; }
    location ~ ^/ariflandvia(/.*)?$ { return 301 /arif-landvia/; }

    location ^~ /arif-landvia/ {
        set $upstream undangan-arif:80;
        resolver 127.0.0.11 valid=30s;
        rewrite ^/arif-landvia/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}
